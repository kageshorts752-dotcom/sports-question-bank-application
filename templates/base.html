<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title or "Sports Question Bank" }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
<div class="container"><a class="navbar-brand fw-bold" href="{{ url_for('index') }}">🏆 Sports Question Bank</a>
<div><a class="btn btn-light btn-sm me-2" href="{{ url_for('add') }}">+ Add Question</a>
<a class="btn btn-warning btn-sm" href="{{ url_for('question_set') }}">Generate Set</a></div>
</div></nav>
<main class="container py-4">
{% with messages=get_flashed_messages() %}{% if messages %}
{% for m in messages %}<div class="alert alert-success">{{ m }}</div>{% endfor %}
{% endif %}{% endwith %}
{% block content %}{% endblock %}
</main>
<footer class="text-center text-muted py-4">BCA Sports Technology Project 2026-27 | Project No. 15</footer>
</body></html>
